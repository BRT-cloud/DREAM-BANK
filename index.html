    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: #f6f5f2; /* cozy warm cream bg */
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .app-container {
      width: 95vw;
      max-width: 1280px;
      min-height: 100vh;
      background: #ffffff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    @media (min-width: 640px) {
      .app-container {
        min-height: 800px;
        height: 90vh;
        max-height: 950px;
        border-radius: 45px;
        margin: 20px 0;
      }
    }

    /* Animations */
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    .animate-float {
      animation: floating 3.5s ease-in-out infinite;
    }

    /* UI elements */
    .btn, .btn-bouncy {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .btn:active, .btn-bouncy:active {
      transform: scale(0.94) translateY(3px);
    }
    
    .btn {
      box-shadow: 0 6px 0 rgba(0,0,0,0.06), 0 10px 20px rgba(0,0,0,0.05);
    }
    .btn:active {
      box-shadow: 0 2px 0 rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.05);
    }
    
    /* 이모지 상단 잘림 방지 */
    .emoji-fix {
      display: inline-block;
      line-height: 1.2;
      padding-top: 0.15em;
      padding-bottom: 0.1em;
    }
    
    /* Hide scrollbar for a cleaner look */
    ::-webkit-scrollbar { display: none; }
  </style>

          const res = await fetch(SCRIPT_URL + "?action=read");

            const parsedData = data.map(u => {
              let av = { bg: 'none', skin: '#fce2c4', hairColor: '#7a5c43', clothesBase: '#f4a261', hairBack: 'none', eyes: 'normal', nose: 'tiny', mouth: 'smile', blush: 'none', bottoms: 'pants', tops: 'tshirt', hairFront: 'bangs', hat: 'none', handItem: 'none' };

              try {
                const local = localStorage.getItem(`avatar_${u.name}`);
                if(local) {
                  const p = JSON.parse(local);
                  if(p.config) av = {...av, ...p.config};
                  if(p.unlocked) unl = [...new Set([...unl, ...p.unlocked])];
                }
              } catch(e) {}
              
              if(u.avatarData) {
                try {
                  const p = JSON.parse(u.avatarData);
                  if(p.config) av = {...av, ...p.config};
                  if(p.unlocked) unl = [...new Set([...unl, ...p.unlocked])];
                } catch(e) {}
              }

              // 구글 시트에서 가져온 학생별 시간표 데이터 연동
              if (u.timetableData) {
                try {
                  const parsedTt = typeof u.timetableData === 'string' ? JSON.parse(u.timetableData) : u.timetableData;
                  setAllTimetables(prev => ({
                    ...prev,
                    [u.name]: parsedTt
                  }));
                } catch(e) {}
              }

              return { ...u, avatar: av, unlocked: unl };
            });

            setUsers(parsedData);
            if (parsedData.length > 0 && !selectedStudentForTimetable) {
              setSelectedStudentForTimetable(parsedData[0].name);
            }
            
            if (currentUser) {
              const updated = parsedData.find(u => u.name === currentUser.name);
              if (updated) setCurrentUser(updated);
            }
          }
        } catch (err) {
          console.error("Failed to fetch", err);
          if(users.length === 0) {
            const fallbackUsers = [{ name: '튤립', balance: 5000, avatar:{hair:'short'}, unlocked:[] }];
            setUsers(fallbackUsers);
            if(!selectedStudentForTimetable) setSelectedStudentForTimetable('튤립');
          }
        }
        setLoading(false);

      const handleAvatarUpdate = async (newConfig, newUnlocked, cost, logCategory) => {

        setView('dashboard');

        const payload = {
          name: currentUser.name,
          amount: cost,
          balance: newBalance,
          type: '사용',
          category: logCategory,
          avatarData: avatarDataStr
        };
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },

          setTimeout(fetchUsers, 1500);
        } catch(e) {}

      const handleLogin = (e) => {
        e.preventDefault();

        if (trimmed === '관리자' && pin === '1234') {
          setView('admin');
          return;

        let found = users.find(u => u.name === trimmed);
        if (!found) {
          found = {

            balance: 5000,

            unlocked: ['bg_none', 'bg_room', 'hairBack_none', 'hairBack_long', 'eyes_normal', 'eyes_happy', 'nose_tiny', 'nose_round', 'mouth_smile', 'blush_none', 'bottoms_pants', 'tops_tshirt', 'hairFront_bangs', 'hairFront_center', 'hat_none', 'handItem_none']

      const handleTransactionSubmit = async () => {
        if (!txAmount || isNaN(txAmount)) return;
        const amountNum = parseInt(txAmount, 10);
        if (amountNum <= 0) return;

        if (transactionType === 'use' && amountNum > currentUser.balance) {
          setAlertMsg('앗! 잔액이 부족해요 😢');
          setTimeout(() => setAlertMsg(''), 3000);
          return;

        const newBalance = transactionType === 'save' 
          ? currentUser.balance + amountNum 
          : currentUser.balance - amountNum;
          
        const updatedUser = {...currentUser, balance: newBalance};
        setCurrentUser(updatedUser);
        setView('dashboard');
        
        const payload = {
          name: currentUser.name,
          amount: amountNum,
          balance: newBalance,
          type: transactionType === 'save' ? '저축' : '사용',
          category: txCategory || '기타',

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)

          console.error('Transaction error', error);

        const tt = getStudentTimetable(studentName);
        let csvContent = "\uFEFF요일,교시,과목명,교실,담당교사,메모,특수학급수업(Y/N)\n";
        DAYS.forEach(day => {
          PERIODS.forEach(p => {
            const item = tt[`${day}-${p}`] || {};
            const isSp = item.isSpecial ? 'Y' : 'N';
            csvContent += `"${day}","${p}","${item.subject || ''}","${item.room || ''}","${item.teacher || ''}","${item.memo || ''}","${isSp}"\n`;
          });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${studentName}_맞춤형_시간표.csv`;
        link.click();

      const importCSV = (e, studentName) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target.result;
            const lines = text.split('\n');
            const newTt = { ...getStudentTimetable(studentName) };
            
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) continue;
              const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
              if (cols.length >= 2) {
                const day = cols[0];
                const p = cols[1];
                if (DAYS.includes(day) && PERIODS.includes(parseInt(p, 10))) {
                  const key = `${day}-${p}`;
                  newTt[key] = {
                    subject: cols[2] || '',
                    room: cols[3] || '',
                    teacher: cols[4] || '',
                    memo: cols[5] || '',
                    isSpecial: (cols[6] || '').toUpperCase() === 'Y'

          {alertMsg && (

              {alertMsg}
            </div>
          )}
        </div>
        );
      };

            <div className="flex justify-between items-center mb-4 pt-2">
              <h2 className="text-3xl font-extrabold text-gray-800 flex items-center">
                <span className="mr-3 text-4xl emoji-fix">👑</span> 관리자 패널
              </h2>
              <button onClick={() => setView('login')} className="text-base bg-white shadow-sm text-gray-600 px-5 py-2.5 rounded-full font-bold active:scale-95 transition-all">
                나가기
              </button>
            </div>

            {/* Admin Tab Switcher */}
            <div className="flex bg-slate-200/70 p-1.5 rounded-3xl mb-6 shadow-inner flex-shrink-0">
              <button 
                onClick={() => setAdminTab('points')}
                className={`flex-1 py-3 rounded-2xl font-extrabold text-base transition-all flex items-center justify-center space-x-2 ${adminTab === 'points' ? 'bg-white text-indigo-600 shadow-md' : 'text-slate-600 hover:text-slate-900'}`}
              >
                <IconCoins/>
                <span>학생 상벌점/자산 현황</span>
              </button>
              <button 
                onClick={() => setAdminTab('timetable')}
                className={`flex-1 py-3 rounded-2xl font-extrabold text-base transition-all flex items-center justify-center space-x-2 ${adminTab === 'timetable' ? 'bg-white text-indigo-600 shadow-md' : 'text-slate-600 hover:text-slate-900'}`}
              >
                <IconCalendar/>
                <span>학생별 맞춤 시간표 관리</span>
              </button>
            </div>

            {/* Admin Tab 1: 상벌점/자산 현황 */}
            {adminTab === 'points' && (
              <div className="flex-1 flex flex-col min-h-0">
                <div className="flex justify-between items-center mb-4 px-2">
                  <span className="text-gray-500 font-bold text-lg">학생 명단 ({users.length}명)</span>
                  <button onClick={fetchUsers} className="text-blue-500 text-lg font-bold flex items-center active:scale-95 transition-all">
                    <svg width="20" height="20" className="mr-2" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.13-5.88L2 9"/></svg>
                    새로고침
                  </button>
                </div>

                <div className="space-y-4 overflow-y-auto flex-1 pb-6 px-1">
                  {users.map((u, i) => (
                    <div key={i} className="bg-white p-5 rounded-[30px] shadow-[0_5px_15px_rgba(0,0,0,0.03)] flex justify-between items-center flex-row">
                      <div className="flex items-center">
                        <div className="w-14 h-14 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-full flex items-center justify-center text-2xl mr-4 text-blue-600 font-extrabold shadow-inner">
                          {u.name.charAt(0)}
                        </div>
                        <div>
                          <span className="text-2xl font-bold text-gray-800">{u.name}</span>
                          <p className="text-xs text-slate-400 font-medium">꿈키움 은행 계좌 보유</p>
                        </div>
                      </div>
                      
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl font-extrabold text-[#3b82f6] mr-2">
                          {formatMoney(u.balance || 0)}
                        </span>
                        <button 
                          onClick={() => {
                            setSelectedStudentForTimetable(u.name);
                            setAdminTab('timetable');
                          }}
                          className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-extrabold text-xs px-4 py-2.5 rounded-2xl transition-all flex items-center"
                        >
                          <span className="mr-1">📅</span> 시간표 편집
                        </button>
                      </div>
                    </div>
                  ))}
                  {loading && users.length === 0 && (
                    <div className="text-center text-gray-400 py-10 text-xl font-bold">불러오는 중...</div>
                  )}
                </div>
              </div>
            )}

            {/* Admin Tab 2: 시간표 관리 (편집 에디터) */}
            {adminTab === 'timetable' && (
              <div className="flex-1 flex flex-col overflow-hidden bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                {/* 컨트롤 바 */}
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4 bg-slate-50 p-4 rounded-2xl border border-slate-200/80 flex-shrink-0">
                  <div className="flex items-center space-x-3">
                    <label className="font-extrabold text-slate-700 text-sm">학생 선택:</label>
                    <select 
                      value={targetStudent}
                      onChange={e => setSelectedStudentForTimetable(e.target.value)}
                      className="bg-white border border-slate-300 rounded-xl px-4 py-2 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 shadow-xs"
                    >
                      {users.map(u => (
                        <option key={u.name} value={u.name}>{u.name} 학생</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <button 
                      onClick={copyDefaultTimetable}
                      className="bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-2 rounded-xl text-xs font-extrabold transition-all shadow-xs"
                    >
                      📋 기본 시간표 복사
                    </button>
                    <button 
                      onClick={() => exportCSV(targetStudent)}
                      className="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-4 py-2 rounded-xl text-xs font-extrabold transition-all shadow-xs"
                    >
                      📥 CSV 다운로드
                    </button>
                    <label className="bg-blue-100 hover:bg-blue-200 text-blue-900 px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer transition-all shadow-xs">
                      📤 CSV 업로드
                      <input type="file" accept=".csv" onChange={(e) => importCSV(e, targetStudent)} className="hidden" />
                    </label>
                  </div>
                </div>

                <p className="text-xs text-slate-500 font-bold mb-3 flex items-center">
                  💡 안내: 각 시간표 셀을 클릭하면 과목명, 교실 위치, 담당 교사, 메모 및 <span className="text-emerald-600 font-extrabold mx-1">🌟 특수학급/개별화 수업 여부</span>를 편집할 수 있습니다.
                </p>

                {/* 5x7 그리드 타임테이블 에디터 */}
                <div className="flex-1 overflow-auto">
                  <div className="min-w-[700px]">
                    <div className="grid grid-cols-6 gap-2 mb-2 text-center font-extrabold text-slate-600 text-sm">
                      <div className="p-2.5 bg-slate-100 rounded-xl">교시</div>
                      {DAYS.map(day => (
                        <div key={day} className="p-2.5 bg-indigo-100 text-indigo-900 rounded-xl">
                          {day}요일
                        </div>
                      ))}
                    </div>

                    {PERIODS.map(p => (
                      <div key={p} className="grid grid-cols-6 gap-2 mb-2">
                        <div className="bg-slate-50 p-2 rounded-xl flex flex-col items-center justify-center border border-slate-100 text-slate-500 font-bold text-xs">
                          <span className="text-indigo-600 font-extrabold">{p}교시</span>
                          <span className="text-[10px]">{PERIOD_TIMES[p-1].start}</span>
                        </div>

                        {DAYS.map(day => {
                          const key = `${day}-${p}`;
                          const cell = currentTt[key] || {};
                          const style = SUBJECT_COLORS[cell.subject] || (cell.isSpecial ? SUBJECT_COLORS['특수학급'] : SUBJECT_COLORS['default']);

                          return (
                            <button 
                              key={key}
                              onClick={() => openEditCell(day, p)}
                              className={`p-2.5 rounded-xl border-2 transition-all text-left flex flex-col justify-between min-h-[90px] relative hover:scale-[1.02] hover:shadow-md cursor-pointer ${cell.isSpecial ? 'bg-emerald-50 border-emerald-400 ring-2 ring-emerald-200' : `${style.bg} ${style.border}`}`}
                            >
                              {cell.isSpecial && (
                                <span className="absolute top-1 right-1 bg-emerald-600 text-white text-[9px] px-1.5 py-0.5 rounded-md font-black">
                                  🌟 특수
                                </span>
                              )}

                              <div>
                                <span className={`font-extrabold text-sm block ${style.text}`}>
                                  {cell.subject || '(빈 교시)'}
                                </span>
                                {cell.room && (
                                  <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold mt-1 inline-block ${cell.isSpecial ? 'bg-emerald-600 text-white' : 'bg-white/80 text-slate-700'}`}>
                                    📍 {cell.room}
                                  </span>
                                )}
                              </div>

                              {cell.teacher && (
                                <span className="text-[10px] text-slate-500 truncate block mt-1">
                                  👩‍🏫 {cell.teacher}
                                </span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* 셀 편집 모달 */}
            {editingCellKey && (
              <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-slide-up">
                <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl border-2 border-indigo-100">
                  <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                    <h3 className="text-xl font-extrabold text-slate-800">
                      {editingCellKey} 교시 시간표 편집
                    </h3>
                    <button onClick={() => setEditingCellKey(null)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">
                      ✕
                    </button>
                  </div>

                  <div className="space-y-4">
                    {/* 특수학급/개별화 수업 원클릭 강조 전환 버튼 */}
                    <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 flex items-center justify-between">
                      <div>
                        <span className="font-extrabold text-emerald-950 text-sm block">🌟 특수학급 / 개별화 이동수업</span>
                        <span className="text-xs text-emerald-700 font-medium">특수학급실(꿈키움반) 이동 강조 표출</span>
                      </div>
                      <button 
                        type="button"
                        onClick={() => {
                          const nextState = !cellForm.isSpecial;
                          setCellForm({
                            ...cellForm,
                            isSpecial: nextState,
                            subject: nextState ? (cellForm.subject || '특수학급(개별화)') : cellForm.subject,
                            room: nextState ? (cellForm.room || '꿈키움반(1층)') : cellForm.room
                          });
                        }}
                        className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${cellForm.isSpecial ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-emerald-700 border border-emerald-300'}`}
                      >
                        {cellForm.isSpecial ? '✓ 특수학급 수업 설정됨' : '+ 특수학급 지정'}
                      </button>
                    </div>

                    {/* 과목명 입력 & 프리셋 */}
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">과목명</label>
                      <input 
                        type="text"
                        placeholder="예: 국어, 수학, 특수학급"
                        value={cellForm.subject}
                        onChange={e => setCellForm({ ...cellForm, subject: e.target.value })}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                      />
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {['국어', '수학', '사회', '과학', '영어', '체육', '음악', '미술', '창체', '특수학급'].map(sub => (
                          <button 
                            key={sub}
                            type="button"
                            onClick={() => setCellForm({ 
                              ...cellForm, 
                              subject: sub, 
                              isSpecial: sub === '특수학급' ? true : cellForm.isSpecial,
                              room: sub === '특수학급' ? '꿈키움반(1층)' : cellForm.room 
                            })}
                            className="px-2.5 py-1 bg-slate-100 hover:bg-indigo-100 text-slate-700 font-bold text-xs rounded-lg transition-all"
                          >
                            {sub}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 교실 위치 */}
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">교실 (장소)</label>
                      <input 
                        type="text"
                        placeholder="예: 4-1교실, 꿈키움반(1층), 과학실"
                        value={cellForm.room}
                        onChange={e => setCellForm({ ...cellForm, room: e.target.value })}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                      />
                    </div>

                    {/* 담당 교사 */}
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">담당 교사</label>
                      <input 
                        type="text"
                        placeholder="예: 김선생님, 강선생님"
                        value={cellForm.teacher}
                        onChange={e => setCellForm({ ...cellForm, teacher: e.target.value })}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                      />
                    </div>

                    {/* 메모/준비물 */}
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">메모 / 준비물</label>
                      <input 
                        type="text"
                        placeholder="예: 배움공책 준비, 이동시 조용히"
                        value={cellForm.memo}
                        onChange={e => setCellForm({ ...cellForm, memo: e.target.value })}
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                      />
                    </div>
                  </div>

                  <div className="flex space-x-3 mt-6">
                    <button 
                      onClick={() => setEditingCellKey(null)}
                      className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition-all"
                    >
                      취소
                    </button>
                    <button 
                      onClick={saveEditCell}
                      className="flex-1 py-3 bg-indigo-600 text-white font-extrabold rounded-2xl shadow-lg hover:bg-indigo-700 transition-all"
                    >
                      저장하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {alertMsg && (
              <div className="absolute top-8 left-1/2 transform -translate-x-1/2 bg-red-100 text-red-600 px-8 py-4 rounded-full font-bold shadow-xl animate-slide-up text-lg z-50">
                {alertMsg}
              </div>
            )}
          </div>
        );
      };

      const renderAvatarStudio = () => {
         const handleBuy = (type, item) => {
            const isUnlocked = currentUser.unlocked.includes(`${type}_${item.id}`) || item.price === 0;
            if (isUnlocked) {
               setAvatarTemp({...avatarTemp, [type]: item.id});
            } else {
               if (window.confirm(`[${item.name}] 장식을 ${formatMoney(item.price)}에 구매할까요?`)) {
                  if (currentUser.balance < item.price) {
                     setAlertMsg('앗! 잔액이 부족해요 😢');
                     setTimeout(() => setAlertMsg(''), 3000);
                     return;
                  }
                  const newTemp = {...avatarTemp, [type]: item.id};
                  setAvatarTemp(newTemp);
                  const newUnlocked = [...currentUser.unlocked, `${type}_${item.id}`];
                  handleAvatarUpdate(newTemp, newUnlocked, item.price, `꾸미기 - ${item.name}`);
               }
            }
         };

         const tabs = [
            { id:'bg', icon:'🖼️', name:'배경' },
            { id:'skin', icon:'🎨', name:'피부색' },
            { id:'clothesBase', icon:'🧶', name:'옷색상' },
            { id:'hairFront', icon:'✂️', name:'앞머리' },
            { id:'hairBack', icon:'🎀', name:'뒷머리' },
            { id:'eyes', icon:'👀', name:'눈' },
            { id:'nose', icon:'👃', name:'코' },
            { id:'mouth', icon:'👄', name:'입' },
            { id:'blush', icon:'😊', name:'볼터치' },
            { id:'tops', icon:'👕', name:'상의' },
            { id:'bottoms', icon:'👖', name:'하의' },
            { id:'hat', icon:'👒', name:'모자' },
            { id:'handItem', icon:'🪀', name:'손장식' }
         ];

         return (
            <div className="flex flex-col h-full bg-[#f8fafc] animate-slide-up relative">
               <div className="p-6 pb-4 flex justify-between items-center bg-white rounded-b-[35px] shadow-sm z-10 flex-shrink-0">
                  <h2 className="text-2xl font-extrabold text-indigo-600 tracking-tight">스튜디오 ✨</h2>
                  <button 
                     onClick={() => handleAvatarUpdate(avatarTemp, currentUser.unlocked, 0, '아바타 변경')} 
                     className="bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-6 py-3 rounded-full font-bold shadow-lg active:scale-95 transition-all text-sm"
                  >
                     저장/나가기
                  </button>
               </div>
               
               <div className="flex-1 flex flex-col items-center justify-center p-4 flex-shrink-0 min-h-[340px] w-full">
                  <div className="w-full max-w-[320px] sm:max-w-[360px] aspect-[5/6] bg-white rounded-[35px] shadow-[0_20px_40px_rgba(0,0,0,0.08)] flex items-center justify-center border-4 border-indigo-50 relative overflow-hidden transition-all">
                     <Avatar config={avatarTemp} className="w-full h-full object-cover drop-shadow-2xl" />
                     <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/80 backdrop-blur-md text-indigo-700 px-6 py-2 rounded-full font-extrabold shadow-sm flex items-center text-sm sm:text-lg z-10 whitespace-nowrap border-2 border-indigo-100">
                        <span className="mr-2 emoji-fix">💰</span> 남은 돈: {formatMoney(currentUser?.balance)}
                     </div>
                  </div>
               </div>

               <div className="bg-white p-6 rounded-t-[45px] shadow-[0_-10px_30px_rgba(0,0,0,0.04)] h-5/12 sm:h-1/2 flex flex-col flex-shrink-0">
                  <div className="flex overflow-x-auto space-x-2 pb-4 mb-2 styled-scroll flex-shrink-0">
                     {tabs.map(t => (
                        <button key={t.id} onClick={()=>setAvatarTab(t.id)} className={`px-4 py-3 rounded-3xl font-bold flex flex-col items-center justify-center flex-shrink-0 transition-all ${avatarTab===t.id ? 'bg-indigo-500 text-white shadow-md' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}>
                           <span className="text-2xl mb-1 emoji-fix">{t.icon}</span>
                           <span className="text-xs">{t.name}</span>
                        </button>
                     ))}
                  </div>
                  
                  <div className="flex-1 overflow-y-auto pb-4 pt-1 px-1 styled-scroll content-start">
                     {['skin', 'clothesBase'].includes(avatarTab) && (
                        <div className="flex flex-wrap gap-4 justify-center">
                           {AVATAR_COLORS[avatarTab].map(col => (
                              <button key={col} onClick={()=>setAvatarTemp({...avatarTemp, [avatarTab]: col})} className="w-16 h-16 rounded-full shadow-md border-4 transition-all focus:scale-110 active:scale-95 btn-bouncy" style={{backgroundColor: col, borderColor: avatarTemp[avatarTab]===col ? '#6366f1' : 'transparent'}} />
                           ))}
                        </div>
                     )}
                     
                     {['bg', 'hairBack', 'eyes', 'nose', 'mouth', 'blush', 'bottoms', 'tops', 'hairFront', 'hat', 'handItem'].includes(avatarTab) && (
                        <div className="flex flex-col gap-4">
                           {['hairFront', 'hairBack'].includes(avatarTab) && (
                              <div className="flex overflow-x-auto gap-3 pb-3 pt-1 styled-scroll">
                                 {AVATAR_COLORS.hairColor.map(col => (
                                    <button key={col} onClick={()=>setAvatarTemp({...avatarTemp, hairColor: col})} className="w-12 h-12 flex-shrink-0 rounded-full shadow-sm border-4 transition-all btn-bouncy" style={{backgroundColor: col, borderColor: avatarTemp.hairColor===col ? '#6366f1' : 'transparent'}} />
                                 ))}
                              </div>
                           )}
                           <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
                              {AVATAR_CATALOG[avatarTab].map(item => {
                                 const isUnl = currentUser.unlocked.includes(`${avatarTab}_${item.id}`) || item.price === 0;
                                 const isEq = avatarTemp[avatarTab] === item.id;
                                 return (
                                    <button key={item.id} onClick={()=>handleBuy(avatarTab, item)} className={`relative flex flex-col items-center justify-center p-5 rounded-3xl border-4 transition-all btn-bouncy ${isEq ? 'border-indigo-400 bg-[#eff6ff]' : 'border-gray-50 bg-white hover:bg-gray-50'}`}>
                                       <span className="text-lg font-extrabold text-gray-700 mb-3">{item.name}</span>
                                       {!isUnl && <span className="text-sm bg-pink-100 text-pink-600 px-4 py-1.5 rounded-full font-bold">{item.price/1000}k 원</span>}
                                       {isUnl && <span className={`text-xs px-4 py-1.5 rounded-full font-bold ${isEq ? 'bg-indigo-500 text-white' : 'bg-green-100 text-green-700'}`}>{isEq ? '착용 중' : '보유'}</span>}
                                    </button>
                                 )
                              })}
                           </div>
                        </div>
                     )}
                  </div>
               </div>

               {alertMsg && (
                 <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-100 text-red-600 px-8 py-4 rounded-full font-bold shadow-2xl animate-slide-up whitespace-nowrap z-50 text-xl border-2 border-red-200">
                   {alertMsg}
                 </div>
               )}
            </div>
         );
      };

      return (
        <div className="app-container">
          {view === 'login' && renderLogin()}
          {view === 'dashboard' && renderDashboard()}
          {view === 'transaction' && renderTransaction()}
          {view === 'admin' && renderAdmin()}
          {view === 'avatar-studio' && renderAvatarStudio()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
